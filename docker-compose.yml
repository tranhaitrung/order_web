services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: ${APP_IMAGE:-order-web:latest}
    container_name: order-web
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "3000:3000"

    networks:
      - order-network

  # Optional local Postgres for development — `app` reads DATABASE_URL from .env.local instead,
  # so update that file (not this service) if you switch databases. Start with `docker compose up -d db`.
  db:
    image: postgres:16-alpine
    container_name: order-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: it_house_ordering

    volumes:
      - db-data:/var/lib/postgresql/data

    ports:
      - "5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - order-network

networks:
  order-network:
    driver: bridge

volumes:
  db-data:
